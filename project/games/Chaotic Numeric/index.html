<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATHCOLOR v3</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root {
  --ukuran-bentuk: clamp(100px, 20vw, 300px); 
  --ukuran-angka: clamp(2.34rem, 4.5vw, 5.85rem); 
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#080808;
  font-family:'DM Mono',monospace;
  width:100vw; height:100vh; overflow:hidden;
}
body::before {
  content:''; position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
  background-size:44px 44px; pointer-events:none;
}

/* ── HUD ── */
#hud {
  position:fixed; top:0; left:0; right:0;
  padding:16px 24px; display:none;
  align-items:center; justify-content:space-between;
  z-index:20; gap:16px;
}
.hud-timer {
  font-family:'Bebas Neue',sans-serif; font-size:1.4rem;
  letter-spacing:0.25em; color:#242424; min-width:90px; transition:color 0.3s;
}
.hud-timer.ticking { color:#666; }
.hud-controls { display:flex; gap:8px; align-items:center; margin-left:auto; }
.ctrl-btn {
  background:transparent; border:1px solid #1a1a1a; border-radius:2px;
  padding:5px 14px; color:#2a2a2a;
  font-family:'Bebas Neue',sans-serif; font-size:0.75rem; letter-spacing:0.25em;
  cursor:pointer; transition:all 0.15s;
}
.ctrl-btn:hover            { border-color:#444; color:#666; }
.ctrl-btn.pause-btn:hover  { border-color:#ffd060; color:#ffd060; }
.ctrl-btn.pause-btn.active { border-color:#ffd060; color:#ffd060; background:rgba(255,208,96,0.05); }

/* ── STREAM SCENE (LOCKED TO 16:9 UHD ASPECT RATIO) ── */
#gameScreen { 
  position: fixed; 
  top: 50%; left: 50%; 
  transform: translate(-50%, -50%);
  width: 100vw;
  height: 56.25vw; /* 16:9 Aspect Ratio (1080/1920 = 0.5625) */
  max-height: 100vh;
  max-width: 177.78vh; /* 16:9 Aspect Ratio (1920/1080 = 1.7778) */
  overflow: hidden; 
  display: none; 
  box-shadow: 0 0 0 1px rgba(255,255,255,0.03); /* Batas frame yang sangat tipis */
  z-index: 10;
}

.stream-col { position:absolute; inset:0; overflow:visible; pointer-events:none; z-index:10; }

.stream-item {
  position:absolute; top:50%; left:50%;
  width: var(--ukuran-bentuk); 
  height: var(--ukuran-bentuk);
  aspect-ratio: 1 / 1; 
  padding: 10px; 
  display:flex; align-items:center; justify-content:center; text-align: center;
  opacity:0; transform-origin:center; mix-blend-mode: screen;
  will-change: transform, opacity; 
}

.stream-item.red {
  border-radius:50%; border:clamp(3px, 1vw, 6px) solid #e57373; 
  background:rgba(229, 115, 115, 0.08); 
}
.stream-item.blue {
  border-radius:12px; border:clamp(3px, 1vw, 6px) solid #64b5f6; 
  background:rgba(100, 181, 246, 0.08); 
}

.stream-item .katex { 
  font-size: var(--ukuran-angka) !important; 
  font-weight: 900 !important;
  -webkit-text-stroke: 1px currentColor; 
}

.crosshair-h, .crosshair-v { position:absolute; top:50%; left:50%; background:rgba(255,255,255,0.04); pointer-events:none; z-index:9; transform:translate(-50%,-50%); }
.crosshair-h { width: 100%; height: 1px; }
.crosshair-v { width: 1px; height: 100%; }
.vignette { position:absolute; inset:0; pointer-events:none; z-index:11; background:radial-gradient(circle at center, transparent 30%, rgba(8,8,8,0.9) 80%, #080808 100%); }

.loop-banner {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:'Bebas Neue',sans-serif; font-size:clamp(4rem,10vw,8rem); letter-spacing:0.3em;
  color:rgba(255,255,255,0.2); z-index:15; pointer-events:none; animation:bannerFade 1.2s ease forwards;
}

#pausedBanner {
  display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:'Bebas Neue',sans-serif; font-size:clamp(4rem,10vw,8rem); letter-spacing:0.4em;
  color:rgba(255,208,96,0.6); z-index:25; pointer-events:none;
}

/* ── START SCREEN ── */
#startScreen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:30; }
.logo { font-family:'Bebas Neue',sans-serif; font-size:clamp(3rem,9vw,5.5rem); letter-spacing:0.3em; margin-bottom:6px; }
.logo .r { color:#e57373; }
.logo .b { color:#64b5f6; }
.tagline { font-size:0.55rem; letter-spacing:0.5em; color:#222; margin-bottom:36px; text-transform: uppercase; }

.mode-row { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; justify-content:center; }
.mode-btn {
  background:transparent; border:1px solid #181818; border-radius:4px;
  padding:10px 24px; color:#444; font-family:'Bebas Neue',sans-serif;
  font-size:1.1rem; letter-spacing:0.2em; cursor:pointer; transition:all 0.2s;
}
.mode-btn.sel { border-color:#fff; color:#fff; background:rgba(255,255,255,0.08); }

.spd-row { display:flex; gap:8px; margin-bottom:36px; flex-wrap:wrap; justify-content:center; }
.spd {
  background:transparent; border:1px solid #181818; border-radius:2px;
  padding:7px 18px; color:#2a2a2a; font-family:'DM Mono',monospace;
  font-size:0.68rem; letter-spacing:0.12em; cursor:pointer;
}
.spd.sel { border-color:#555; color:#aaa; background:rgba(255,255,255,0.04); }

.start-btn {
  background:transparent; border:1px solid #333; border-radius:2px;
  padding:13px 56px; color:#666; font-family:'Bebas Neue',sans-serif;
  font-size:1.4rem; letter-spacing:0.5em; cursor:pointer; transition:all 0.2s;
}
.start-btn:hover { color:#fff; border-color:#fff; background:rgba(255,255,255,0.05); }

/* ── RECALL SCREEN ── */
#recallScreen {
  position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; z-index:30; background:rgba(8,8,8,0.98);
}
.recall-timer { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; letter-spacing:0.3em; color:#ffd060; }
.answer-input {
  background:transparent; border:none; border-bottom:2px solid #1a1a1a;
  padding:8px; font-family:'Bebas Neue',sans-serif; font-size:3.5rem;
  color:#eee; outline:none; text-align:center; width:200px;
}
.answer-input.red:focus { border-color:#e57373; }
.answer-input.blue:focus { border-color:#64b5f6; }
.submit-btn {
  background:transparent; border:1px solid #2a2a2a; border-radius:2px;
  padding:12px 48px; color:#444; font-family:'Bebas Neue',sans-serif;
  font-size:1.2rem; letter-spacing:0.4em; cursor:pointer;
}

/* ── RESULT SCREEN ── */
#resultScreen {
  position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; z-index:30; background:rgba(8,8,8,0.98);
}
.verdict-big { font-family:'Bebas Neue',sans-serif; font-size:clamp(3rem,10vw,6rem); letter-spacing:0.2em; }
.verdict-big.win { color:#69ff47; }
.verdict-big.lose { color:#ff5370; }
.result-card { border:1px solid #141414; padding:20px; text-align:center; min-width:180px; }
.rc-answer { font-family:'Bebas Neue',sans-serif; font-size:3rem; }
.rc-answer.ok { color:#69ff47; }
.rc-answer.bad { color:#e57373; }

@keyframes bannerFade {
  0% { opacity:0; transform:translate(-50%,-50%) scale(0.8); }
  20% { opacity:1; transform:translate(-50%,-50%) scale(1); }
  80% { opacity:1; transform:translate(-50%,-50%) scale(1); }
  100% { opacity:0; transform:translate(-50%,-50%) scale(1.1); }
}
</style>
</head>
<body>

<div id="startScreen">
  <div class="logo"><span class="r">MATH</span><span class="b">COLOR</span></div>
  <div class="tagline" id="taglineText">PILIH MODE DAN KECEPATAN</div>
  <div class="mode-row">
    <button class="mode-btn" onclick="setMode(this,'up-down')">UP - DOWN</button>
    <button class="mode-btn sel" onclick="setMode(this,'chaos')">CHAOS</button>
    <button class="mode-btn" onclick="setMode(this,'pop-up')">POP UP</button>
  </div>
  <div class="spd-row">
    <button class="spd sel" onclick="setSpd(this,2000)">2s</button>
    <button class="spd" onclick="setSpd(this,2500)">2,5s</button>
    <button class="spd" onclick="setSpd(this,3000)">3s</button>
    <button class="spd" onclick="setSpd(this,3500)">3,5s</button>
    <button class="spd" onclick="setSpd(this,4000)">4s</button>
  </div>
  <button class="start-btn" onclick="startGame()"><span>MULAI</span></button>
</div>

<div id="hud">
  <div class="hud-timer" id="hudTimer">0:00</div>
  <div class="hud-controls">
    <button class="ctrl-btn" onclick="resetGame(false)">⌂ HOME</button>
    <button class="ctrl-btn pause-btn" id="pauseBtn" onclick="togglePause()">⏸ STOP</button>
    <button class="ctrl-btn" onclick="goRecall()">✓ JAWAB</button>
  </div>
</div>

<div id="pausedBanner">PAUSED</div>

<div id="gameScreen">
  <div id="redStream" class="stream-col"></div>
  <div id="blueStream" class="stream-col"></div>
  <div class="crosshair-h"></div>
  <div class="crosshair-v"></div>
  <div class="vignette"></div>
</div>

<div id="recallScreen">
  <div class="recall-timer" id="recallTimer">0:00</div>
  <div style="display:flex; gap:40px; margin:20px 0;">
    <div style="text-align:center">
      <div style="color:#e57373; font-family:'Bebas Neue'; letter-spacing:0.2em; margin-bottom:10px;">MERAH</div>
      <input class="answer-input red" type="number" id="redInput" placeholder="?">
    </div>
    <div style="text-align:center">
      <div style="color:#64b5f6; font-family:'Bebas Neue'; letter-spacing:0.2em; margin-bottom:10px;">BIRU</div>
      <input class="answer-input blue" type="number" id="blueInput" placeholder="?">
    </div>
  </div>
  <button class="submit-btn" onclick="submitAnswer()">SUBMIT JAWABAN</button>
</div>

<div id="resultScreen">
  <div class="verdict-big" id="verdictBig"></div>
  <div id="resultTime" style="color:#ffd060; font-family:'Bebas Neue'; letter-spacing:0.2em;"></div>
  <div id="resultCards" style="display:flex; gap:20px; margin:20px 0;"></div>
  <button class="submit-btn" onclick="resetGame(true)">MAIN LAGI</button>
  <button class="submit-btn" onclick="resetGame(false)" style="margin-top:10px; font-size:0.8rem; border-color:#111;">KEMBALI KE HOME</button>
</div>

<script>
const AC = new (window.AudioContext || window.webkitAudioContext)();
function tone(f,t='sine',d=0.1,v=0.1){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type=t; o.frequency.value=f;
  g.gain.setValueAtTime(v,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.start(); o.stop(AC.currentTime+d);
}

const RED_SEQ = ['+ \\sqrt{48400}','+ (-171)','\\times \\sqrt{49}','\\div 0,5','+ 155','\\div \\sqrt{841}','\\times (-2^{3})','\\div 4','+ (-5^{2})','\\times 6','+ (-231)','\\div 3^{3}','\\times (-12)','\\div \\sqrt{324}','\\times 2,5','\\times (-20)','+ 276','\\div 4','+ 325','\\div \\sqrt{169}','\\times 2^{3}','+ 680','\\div (-4)','\\times 2','+ 973'];
const BLUE_SEQ = ['+ \\sqrt{67600}','\\times 3','+ (-15^{2})','\\times \\frac{1}{5}','+ (-12^{2})','+ (-415)','\\div \\sqrt{256}','\\times 0,5','+ 3^{3}','\\times 13','\\div \\sqrt{169}','+ 108','\\div \\sqrt{121}','\\times (-5^{2})','+ 779','\\div 24','\\times (-40)','\\div 10','+ 6^{2}','\\times (-0,5)','+ (-145)','\\div \\sqrt{121}','\\times 14','\\div \\frac{1}{4}','+ 1089'];
const CORRECT_RED = 581, CORRECT_BLUE = 473, N = 25;

let gameMode = 'chaos', speed = 2000, paused = false, elapsed = 0, clockInt = null;
let scrollOffset = -0.5, lastFrame = null, animating = false, rafId = null, lastIdx = -1, bannerActive = false;

// KOORDINAT FIXED
const anglesRed = [1.0, 2.5, 4.0, 5.5, 0.5, 3.1, 1.8, 4.5, 6.0, 2.2, 3.8, 5.1, 0.9, 2.8, 4.2, 5.8, 1.5, 3.5, 0.3, 2.0, 4.8, 6.2, 1.1, 3.2, 5.0];
const anglesBlue = [3.0, 5.0, 1.5, 3.5, 2.0, 5.5, 4.2, 0.8, 2.8, 4.8, 1.2, 2.5, 3.3, 5.2, 0.5, 3.1, 4.0, 6.1, 2.5, 4.5, 1.8, 3.8, 5.5, 0.9, 2.2];
const popRatios = [
  {rx: 0.2, ry: 0.2, bx: -0.2, by: -0.2}, {rx: -0.1, ry: 0.3, bx: 0.3, by: -0.1}, {rx: 0.3, ry: -0.2, bx: -0.3, by: 0.2},
  {rx: -0.25, ry: -0.25, bx: 0.25, by: 0.25}, {rx: 0.15, ry: -0.3, bx: -0.15, by: 0.3}, {rx: -0.3, ry: 0.1, bx: 0.2, by: -0.2},
  {rx: 0.25, ry: 0.15, bx: -0.25, by: -0.15}, {rx: -0.15, ry: -0.15, bx: 0.15, by: 0.15}, {rx: 0.1, ry: 0.25, bx: -0.1, by: -0.25},
  {rx: -0.2, ry: -0.3, bx: 0.2, by: 0.3}, {rx: 0.3, ry: -0.1, bx: -0.3, by: 0.1}, {rx: -0.25, ry: 0.2, bx: 0.25, by: -0.2},
  {rx: 0.15, ry: 0.15, bx: -0.15, by: -0.15}, {rx: -0.1, ry: -0.2, bx: 0.1, by: 0.2}, {rx: 0.2, ry: -0.25, bx: -0.2, by: 0.25},
  {rx: -0.3, ry: 0.3, bx: 0.3, by: -0.3}, {rx: 0.25, ry: 0.0, bx: -0.25, by: 0.0}, {rx: -0.2, ry: -0.1, bx: 0.2, by: 0.1},
  {rx: 0.1, ry: -0.3, bx: -0.1, by: 0.3}, {rx: -0.15, ry: 0.25, bx: 0.15, by: -0.25}, {rx: 0.3, ry: 0.15, bx: -0.3, by: -0.15},
  {rx: -0.25, ry: -0.2, bx: 0.25, by: 0.2}, {rx: 0.2, ry: 0.3, bx: -0.2, by: -0.3}, {rx: -0.1, ry: 0.1, bx: 0.1, by: -0.1},
  {rx: 0.15, ry: -0.15, bx: -0.15, by: 0.15}
];

let redItems = [], blueItems = [];

function setMode(el, m) {
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel'); gameMode = m;
  document.getElementById('taglineText').textContent = m.toUpperCase().replace('-',' ');
}
function setSpd(el, ms) {
  document.querySelectorAll('.spd').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel'); speed = ms;
}

function buildStreams() {
  const rs = document.getElementById('redStream'), bs = document.getElementById('blueStream');
  rs.innerHTML = ''; bs.innerHTML = ''; redItems = []; blueItems = [];
  for(let i=0; i<N; i++) {
    const r = document.createElement('div'); r.className = 'stream-item red';
    katex.render(`{\\color{#e57373}{${RED_SEQ[i]}}}`, r);
    const b = document.createElement('div'); b.className = 'stream-item blue';
    katex.render(`{\\color{#64b5f6}{${BLUE_SEQ[i]}}}`, b);
    rs.appendChild(r); bs.appendChild(b);
    redItems.push(r); blueItems.push(b);
  }
}

function render() {
  // Koordinat murni dibaca dari gameScreen container (Selalu 16:9 ratio)
  const container = document.getElementById('gameScreen');
  const W = container.clientWidth, H = container.clientHeight;
  
  // MENGHAPUS ILUSI OPTIK ANISOTROPI VEKTOR:
  // Jarak lintas (span) kini UNIVERSAL, dikalkulasi dari hipotenusa absolut rasio 16:9 ditambah buffer keluar layar.
  // Ini memaksa pixel-per-second kecepatan Up-Down SAMA PERSIS 100% dengan Chaos.
  const universalSpan = Math.hypot(W, H) + 400; 

  for(let i=0; i<N; i++) {
    const diff = Math.abs(scrollOffset - i); 
    let xr=0, yr=0, xb=0, yb=0, s=1, o=0;

    if(gameMode === 'chaos') {
      const travelDist = (scrollOffset - i) * universalSpan; 
      xr = Math.cos(anglesRed[i]) * travelDist; 
      yr = Math.sin(anglesRed[i]) * travelDist;
      xb = Math.cos(anglesBlue[i]) * travelDist; 
      yb = Math.sin(anglesBlue[i]) * travelDist;
      s = 0.85; 
      o = diff <= 0.5 ? 1 : 0; 
    } else if(gameMode === 'up-down') {
      // Menggunakan lintasan yang sama panjang dengan Chaos
      const travelDist = (scrollOffset - i) * universalSpan; 
      xr = -W*0.22; yr = travelDist; 
      xb = W*0.22; yb = -travelDist; 
      s = 0.85; 
      o = diff <= 0.5 ? 1 : 0; 
    } else if(gameMode === 'pop-up') {
      xr = popRatios[i].rx * W; yr = popRatios[i].ry * H;
      xb = popRatios[i].bx * W; yb = popRatios[i].by * H;
      s = 0.9; 
      o = diff <= 0.5 ? 1 : 0; 
    }

    redItems[i].style.transform = `translate3d(calc(-50% + ${xr}px), calc(-50% + ${yr}px), 0) scale(${s})`;
    redItems[i].style.opacity = o;
    
    blueItems[i].style.transform = `translate3d(calc(-50% + ${xb}px), calc(-50% + ${yb}px), 0) scale(${s})`;
    blueItems[i].style.opacity = o;
  }
}

function loop(ts) {
  if(!animating) return;
  rafId = requestAnimationFrame(loop);
  if(paused || bannerActive) { lastFrame = null; return; }
  if(lastFrame) {
    const baseSpeed = speed * 1.5; 
    // Karena jarak (span) kini universal, kecepatan efektif disamakan
    const effectiveSpeed = (gameMode === 'chaos' || gameMode === 'up-down') ? baseSpeed * 1.5 : baseSpeed;
    
    scrollOffset += (ts - lastFrame) / effectiveSpeed;
  }
  lastFrame = ts;
  render();

  const idx = Math.floor(scrollOffset);
  if(idx !== lastIdx && idx >= 0 && idx < N) {
    lastIdx = idx; tone(350, 'triangle', 0.05, 0.04);
  }

  if(scrollOffset >= N - 0.4 && !bannerActive) {
    bannerActive = true;
    showBanner('FINISH', 1500, () => {
      setTimeout(() => {
        showBanner('START', 2500, () => { 
          setTimeout(() => {
            scrollOffset = -0.5; lastIdx = -1;
            bannerActive = false; lastFrame = null;
          }, 1000); 
        });
      }, 500);
    });
  }
}

function showBanner(txt, dur, cb) {
  const b = document.createElement('div'); b.className = 'loop-banner'; b.textContent = txt;
  document.getElementById('gameScreen').appendChild(b);
  setTimeout(() => { b.remove(); if(cb) cb(); }, dur);
}

function startClock() {
  if(clockInt) clearInterval(clockInt);
  clockInt = setInterval(() => { if(!paused && animating && !bannerActive) { elapsed++; updateClock(); } }, 1000);
}
function updateClock() {
  const s = `${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,'0')}`;
  document.getElementById('hudTimer').textContent = s;
  document.getElementById('recallTimer').textContent = s;
}

function startGame() {
  if(AC.state === 'suspended') AC.resume();
  paused = false; elapsed = 0; scrollOffset = -0.5; lastIdx = -1;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('gameScreen').style.display = 'block';
  buildStreams();
  animating = true; bannerActive = true;
  
  showBanner('START', 2500, () => { 
    setTimeout(() => {
      scrollOffset = -0.5; 
      bannerActive = false; 
      lastFrame = null; 
      startClock();
    }, 1000); 
  });
  
  rafId = requestAnimationFrame(loop);
}

function togglePause() {
  paused = !paused;
  document.getElementById('pausedBanner').style.display = paused ? 'block' : 'none';
  document.getElementById('pauseBtn').textContent = paused ? '▶ RESUME' : '⏸ STOP';
  document.getElementById('pauseBtn').classList.toggle('active', paused);
}

function goRecall() {
  animating = false; cancelAnimationFrame(rafId);
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('recallScreen').style.display = 'flex';
}

function submitAnswer() {
  const rVal = parseFloat(document.getElementById('redInput').value);
  const bVal = parseFloat(document.getElementById('blueInput').value);
  if(isNaN(rVal) || isNaN(bVal)) return;
  clearInterval(clockInt);
  document.getElementById('recallScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'flex';
  const rOk = Math.abs(rVal - CORRECT_RED) < 0.1, bOk = Math.abs(bVal - CORRECT_BLUE) < 0.1;
  const v = document.getElementById('verdictBig');
  v.textContent = (rOk && bOk) ? 'SEMPURNA' : 'COBA LAGI';
  v.className = 'verdict-big ' + ((rOk && bOk) ? 'win' : 'lose');
  document.getElementById('resultTime').textContent = `DURASI: ${document.getElementById('recallTimer').textContent}`;
  document.getElementById('resultCards').innerHTML = `
    <div class="result-card"><div style="color:#e57373">MERAH</div><div class="rc-answer ${rOk?'ok':'bad'}">${rVal}</div><div style="font-size:0.6rem; color:#444">Harusnya: ${CORRECT_RED}</div></div>
    <div class="result-card"><div style="color:#64b5f6">BIRU</div><div class="rc-answer ${bOk?'ok':'bad'}">${bVal}</div><div style="font-size:0.6rem; color:#444">Harusnya: ${CORRECT_BLUE}</div></div>
  `;
}

function resetGame(keepStart) {
  animating = false; paused = false; clearInterval(clockInt);
  if(rafId) cancelAnimationFrame(rafId);
  ['hud','gameScreen','recallScreen','resultScreen','pausedBanner'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('redInput').value=''; document.getElementById('blueInput').value='';
  elapsed = 0; updateClock();
  if(keepStart) startGame(); else document.getElementById('startScreen').style.display = 'flex';
}

document.addEventListener('keydown', e => {
  if(e.key === ' ' && animating) { e.preventDefault(); togglePause(); }
  if(e.key === 'Enter' && document.getElementById('recallScreen').style.display === 'flex') submitAnswer();
});
</script>
</body>
</html>
