<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icosahedron Path Solver</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Animasi Pop untuk huruf */
        .letter-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .letter-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none">
        <!-- Toast akan muncul di sini via JS -->
    </div>

    <div class="max-w-4xl w-full bg-slate-900 border border-slate-700 rounded-xl shadow-2xl flex flex-col md:flex-row overflow-hidden">
        
        <!-- PANEL KIRI: SETUP PERMAINAN -->
        <div class="w-full md:w-1/3 bg-slate-800 border-b md:border-b-0 md:border-r border-slate-700 p-6 flex flex-col">
            <h1 class="text-xl font-bold text-indigo-400 mb-1">Path Solver</h1>
            <p class="text-xs text-slate-400 mb-6">Misi Kalkulasi Icosahedron</p>

            <!-- Player Management & Leaderboard -->
            <div class="mb-5">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-slate-300">Pemain / Tim Aktif</label>
                    <button id="btn-add-player" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-200 transition">+ Tambah</button>
                </div>
                <div id="players-container" class="space-y-2 max-h-32 overflow-y-auto pr-1 mb-4">
                    <!-- Daftar player akan di-render di sini -->
                </div>

                <!-- Leaderboard -->
                <div class="border-t border-slate-700 pt-3">
                    <label class="text-xs font-semibold text-slate-400 mb-2 block">🏆 Papan Skor Peringkat</label>
                    <div id="leaderboard-container" class="space-y-1">
                        <!-- Leaderboard akan di-render di sini -->
                    </div>
                </div>
            </div>

            <!-- Mode Selection -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Mode Permainan</label>
                <div class="flex gap-2 bg-slate-900 p-1 rounded border border-slate-700">
                    <button class="mode-btn flex-1 py-1.5 bg-indigo-600 text-white rounded text-xs font-bold transition-colors shadow" data-mode="double">Double (Berantai)</button>
                    <button class="mode-btn flex-1 py-1.5 bg-transparent text-slate-400 hover:text-slate-200 rounded text-xs font-bold transition-colors" data-mode="single">Single (Bebas)</button>
                </div>
            </div>

            <!-- Round Selection -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Pilih Ronde</label>
                <div class="flex gap-2">
                    <button class="round-btn flex-1 py-1.5 bg-indigo-600 text-white rounded text-sm font-bold shadow transition-colors" data-round="1">R1</button>
                    <button class="round-btn flex-1 py-1.5 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded text-sm font-bold shadow transition-colors" data-round="2">R2</button>
                    <button class="round-btn flex-1 py-1.5 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded text-sm font-bold shadow transition-colors" data-round="2A">R2A</button>
                </div>
            </div>

            <!-- Target Number -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Target Number</label>
                <input type="number" id="target-input" placeholder="Masukkan angka target..." class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-lg font-bold text-white focus:outline-none focus:border-indigo-500 transition-all text-center">
            </div>

            <!-- Icosahedron Selection -->
            <div class="mb-2">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Papan Icosahedron</label>
                <div class="flex gap-2">
                    <button class="ico-btn flex-1 py-1.5 bg-emerald-600 text-white rounded text-sm font-bold shadow transition-colors" data-ico="0">Ico 1</button>
                    <button class="ico-btn flex-1 py-1.5 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded text-sm font-bold shadow transition-colors" data-ico="1">Ico 2</button>
                </div>
            </div>

            <!-- Import Topologi -->
            <div class="mt-auto pt-5">
                <input type="file" id="import-topology-file" accept=".json" class="hidden">
                <button id="btn-import-topology" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 border border-slate-600 rounded text-xs font-bold transition-colors flex justify-center items-center gap-2">
                    📥 Import Topologi Khusus
                </button>
            </div>
        </div>

        <!-- PANEL KANAN: INPUT & HASIL -->
        <div class="w-full md:w-2/3 p-6 flex flex-col bg-slate-900">
            
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h2 class="text-sm font-semibold text-slate-300" id="board-title">Kombinasi Huruf Terhubung</h2>
                    <p class="text-xs text-slate-500">Pilih huruf yang sisi-sisinya saling menempel (urutan bebas)</p>
                </div>
                <button id="btn-clear-path" class="text-xs text-red-400 hover:text-red-300 transition">Reset Pilihan</button>
            </div>

            <!-- Display Jalur yang Dipilih -->
            <div class="bg-slate-950 border border-slate-700 rounded-lg p-3 min-h-[60px] flex items-center flex-wrap gap-2 mb-6" id="path-display">
                <span class="text-slate-600 text-sm italic">Belum ada huruf yang dipilih...</span>
            </div>

            <!-- Grid Huruf A-T -->
            <div class="grid grid-cols-4 sm:grid-cols-5 gap-2 mb-8" id="letter-grid">
                <!-- Tombol Huruf akan di-generate via JS -->
            </div>

            <!-- Area Evaluasi / Submit -->
            <div class="mt-auto border-t border-slate-700 pt-4">
                <!-- Tombol Dinamis -->
                <button id="btn-submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-colors text-base font-bold shadow-lg shadow-indigo-900/50 mb-4 tracking-wider">
                    SUBMIT
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL HASIL (POP-UP) -->
    <div id="modal-result" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-slate-800 border border-slate-600 rounded-xl p-6 w-full max-w-md shadow-2xl transform transition-all scale-95 opacity-0" id="modal-content">
            <h3 class="text-center font-bold text-2xl mb-5" id="result-title">Hasil Analisis</h3>
            
            <div class="space-y-4">
                <!-- Kriteria 1 -->
                <div class="flex justify-between items-center p-3 rounded bg-slate-900 border border-slate-700 shadow-inner">
                    <div>
                        <p class="text-sm font-semibold text-slate-200">1. Target Number</p>
                        <p class="text-xs text-slate-400 mt-1" id="result-math-detail">0 = 0</p>
                    </div>
                    <div id="badge-math" class="px-3 py-1.5 rounded text-xs font-bold bg-slate-700 text-slate-400 border border-slate-600">WAIT</div>
                </div>

                <!-- Kriteria 2 -->
                <div class="flex justify-between items-center p-3 rounded bg-slate-900 border border-slate-700 shadow-inner">
                    <div>
                        <p class="text-sm font-semibold text-slate-200">2. Sisi Terhubung</p>
                        <p class="text-xs text-slate-400 mt-1" id="result-path-detail">Mengecek koneksi kelompok...</p>
                    </div>
                    <div id="badge-path" class="px-3 py-1.5 rounded text-xs font-bold bg-slate-700 text-slate-400 border border-slate-600">WAIT</div>
                </div>
            </div>

            <button id="btn-close-modal" class="mt-6 w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold transition-colors shadow">
                Tutup Pengecekan
            </button>
        </div>
    </div>

    <!-- SCRIPT LOGIKA -->
    <script>
        // --- 1. CORE FUNCTIONS (NOTIFICATIONS) ---
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-700 text-white border-slate-600';
            if (type === 'error') bgClass = 'bg-red-900/90 text-red-100 border-red-700 backdrop-blur-sm';
            if (type === 'success') bgClass = 'bg-emerald-900/90 text-emerald-100 border-emerald-700 backdrop-blur-sm';
            
            toast.className = `border px-4 py-3 rounded-lg shadow-xl text-sm font-semibold opacity-0 transition-opacity duration-300 text-center ${bgClass}`;
            toast.innerText = message;
            
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- 2. DATA & STATE MEMORY ---
        let PRESETS = {
            "1": {
                0: [13, 34, 7, 41, 26, 11, 39, 17, 46, 23, 19, 31, 14, 43, 6, 29, 3, 47, 37, 21],
                1: Array(20).fill(0)
            },
            "2": {
                0: [11, 26, 8, 41, 22, 17, 34, 19, 45, 25, 14, 33, 7, 48, 5, 29, 4, 38, 31, 21],
                1: [15, 30, 10, 31, 37, 41, 19, 28, 3, 50, 23, 6, 42, 12, 25, 13, 26, 38, 16, 47]
            },
            "2A": {
                0: [13, 34, 7, 41, 26, 11, 39, 17, 46, 23, 19, 31, 14, 43, 6, 29, 3, 47, 37, 21],
                1: [15, 30, 10, 31, 37, 41, 19, 28, 3, 50, 23, 6, 42, 12, 25, 13, 26, 38, 16, 47]
            }
        };

        let ADJACENCY = [
            [1, 4, 6],    // 0 (A)
            [0, 2, 5],    // 1 (B)
            [1, 3, 9],    // 2 (C)
            [2, 4, 8],    // 3 (D)
            [0, 3, 7],    // 4 (E)
            [1, 15, 19],  // 5 (F)
            [0, 15, 16],  // 6 (G)
            [4, 16, 17],  // 7 (H)
            [3, 17, 18],  // 8 (I)
            [2, 18, 19],  // 9 (J)
            [11, 14, 15], // 10 (K)
            [10, 12, 16], // 11 (L)
            [11, 13, 17], // 12 (M)
            [12, 14, 18], // 13 (N)
            [10, 13, 19], // 14 (O)
            [5, 6, 10],   // 15 (P)
            [6, 7, 11],   // 16 (Q)
            [7, 8, 12],   // 17 (R)
            [8, 9, 13],   // 18 (S)
            [5, 9, 14]    // 19 (T)
        ];

        let state = {
            players: [
                { id: 1, name: "Tim Alpha", active: true, score: 0 },
                { id: 2, name: "Tim Bravo", active: false, score: 0 }
            ],
            mode: "double",
            round: "1", 
            ico: 0,
            path: [],
            passedIco1: false,     // Status penyelesaian tahapan Ico 1 di Round 2/2A
            pendingModalAction: 'none' // Action yang dijalankan saat modal ditutup
        };

        // --- 3. UI ELEMENTS ---
        const playersContainer = document.getElementById('players-container');
        const letterGrid = document.getElementById('letter-grid');
        const pathDisplay = document.getElementById('path-display');
        const targetInput = document.getElementById('target-input');

        // --- 4. RENDERING & UI UPDATES ---
        function renderPlayers() {
            playersContainer.innerHTML = '';
            state.players.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = `flex items-center gap-2 p-1.5 rounded border ${p.active ? 'bg-slate-700 border-indigo-500' : 'bg-slate-900 border-slate-700'} transition-all`;
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'active_player';
                radio.checked = p.active;
                radio.className = 'accent-indigo-500 w-4 h-4 cursor-pointer';
                radio.onchange = () => {
                    state.players.forEach(pl => pl.active = false);
                    p.active = true;
                    renderPlayers();
                };

                const inputName = document.createElement('input');
                inputName.type = 'text';
                inputName.value = p.name;
                inputName.className = 'flex-1 bg-transparent border-none text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-400 rounded px-1';
                inputName.onchange = (e) => {
                    p.name = e.target.value;
                    renderLeaderboard(); // Update papan skor jika ganti nama
                };

                div.appendChild(radio);
                div.appendChild(inputName);

                if(state.players.length > 1) {
                    const btnDel = document.createElement('button');
                    btnDel.innerHTML = '✕';
                    btnDel.className = 'text-slate-500 hover:text-red-400 text-xs px-2';
                    btnDel.onclick = () => {
                        state.players.splice(index, 1);
                        if(p.active && state.players.length > 0) state.players[0].active = true;
                        renderPlayers();
                        renderLeaderboard();
                    };
                    div.appendChild(btnDel);
                }
                playersContainer.appendChild(div);
            });
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            container.innerHTML = '';
            
            // Sort by score
            const sortedPlayers = [...state.players].sort((a, b) => b.score - a.score);
            
            sortedPlayers.forEach((p, index) => {
                let medal = '🏅';
                if (index === 0 && p.score > 0) medal = '🥇';
                else if (index === 1 && p.score > 0) medal = '🥈';
                else if (index === 2 && p.score > 0) medal = '🥉';
                if (p.score === 0) medal = '▪️';

                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-850 border border-slate-700 px-3 py-1.5 rounded text-sm bg-slate-900/50 shadow-inner";
                div.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span>${medal}</span>
                        <span class="text-slate-300 font-semibold text-xs">${p.name}</span>
                    </div>
                    <span class="text-indigo-400 font-bold text-xs">${p.score} pt</span>
                `;
                container.appendChild(div);
            });
        }

        function renderLetterGrid() {
            letterGrid.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const char = String.fromCharCode(65 + i);
                const btn = document.createElement('button');
                const isSelected = state.path.includes(i);
                
                let baseClass = "letter-btn h-12 rounded-lg font-bold text-lg shadow transition-all border-b-4 ";
                if (isSelected) {
                    const orderIndex = state.path.indexOf(i) + 1;
                    baseClass += "bg-indigo-600 text-white border-indigo-800 ring-2 ring-indigo-400";
                    btn.innerHTML = `<span class="opacity-30 text-[10px] absolute top-1 left-1">${orderIndex}</span>${char}`;
                } else {
                    baseClass += "bg-slate-700 text-slate-300 border-slate-900 hover:bg-slate-600 hover:text-white";
                    btn.innerHTML = char;
                }

                btn.className = baseClass + " relative flex items-center justify-center";
                
                btn.onclick = () => {
                    if (isSelected) {
                        const idx = state.path.indexOf(i);
                        state.path = state.path.slice(0, idx);
                    } else {
                        state.path.push(i);
                    }
                    updatePathUI();
                };
                letterGrid.appendChild(btn);
            }
        }

        function updatePathUI() {
            renderLetterGrid();
            
            if (state.path.length === 0) {
                pathDisplay.innerHTML = '<span class="text-slate-600 text-sm italic">Belum ada huruf yang dipilih...</span>';
                return;
            }

            pathDisplay.innerHTML = '';
            state.path.forEach((idx, i) => {
                const char = String.fromCharCode(65 + idx);
                const badge = document.createElement('div');
                badge.className = 'bg-indigo-500/20 border border-indigo-500/50 text-indigo-300 px-2 py-1 rounded text-sm font-bold flex items-center gap-1';
                badge.innerText = char;
                
                pathDisplay.appendChild(badge);
                if (i < state.path.length - 1) {
                    const plus = document.createElement('span');
                    plus.className = 'text-slate-500 text-xs font-bold';
                    plus.innerText = '+';
                    pathDisplay.appendChild(plus);
                }
            });
        }

        function updateIcoUI() {
            document.querySelectorAll('.ico-btn').forEach(b => {
                b.className = "ico-btn flex-1 py-1.5 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded text-sm font-bold shadow transition-colors";
            });
            const activeBtn = document.querySelector(`.ico-btn[data-ico="${state.ico}"]`);
            if (activeBtn) {
                activeBtn.className = "ico-btn flex-1 py-1.5 bg-emerald-600 text-white rounded text-sm font-bold shadow transition-colors";
            }
            document.getElementById('board-title').innerText = `Kombinasi Huruf Terhubung (ICO ${state.ico + 1})`;
        }

        function updateButtonState() {
            const btn = document.getElementById('btn-submit');
            if (state.mode === "double" && state.round !== "1") {
                // Flow Ronde 2 & 2A (Double Mode)
                if (state.ico === 0) {
                    btn.innerText = state.passedIco1 ? "REVISI & NEXT (ICO 1)" : "NEXT (CEK ICO 1)";
                    btn.className = "w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition-colors text-base font-bold shadow-lg shadow-blue-900/50 mb-4 tracking-wider";
                } else {
                    if (!state.passedIco1) {
                        btn.innerText = "KEMBALI KE ICO 1 DULU";
                        btn.className = "w-full py-3 bg-slate-600 hover:bg-slate-500 text-slate-300 rounded-lg transition-colors text-base font-bold shadow-lg mb-4 tracking-wider";
                    } else {
                        btn.innerText = "SUBMIT FINAL (ICO 2)";
                        btn.className = "w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-colors text-base font-bold shadow-lg shadow-indigo-900/50 mb-4 tracking-wider";
                    }
                }
            } else {
                // Flow Ronde 1 ATAU Mode Single
                btn.innerText = "SUBMIT";
                btn.className = "w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-colors text-base font-bold shadow-lg shadow-indigo-900/50 mb-4 tracking-wider";
            }
        }

        function awardPoint() {
            const activePlayer = state.players.find(p => p.active);
            if (activePlayer) {
                activePlayer.score += 1;
                renderLeaderboard();
                showToast(`🎉 ${activePlayer.name} mendapat +1 Poin!`, 'success');
            }
        }

        function hideResult() {
            const modal = document.getElementById('modal-result');
            const modalContent = document.getElementById('modal-content');
            
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                
                // Eksekusi aksi tertunda setelah modal tertutup penuh
                if (state.pendingModalAction === 'goToIco2') {
                    state.passedIco1 = true;
                    state.ico = 1;
                    state.path = [];
                    showToast("Lanjut: Silakan selesaikan tahap Ico 2", "success");
                } else if (state.pendingModalAction === 'win') {
                    awardPoint();
                    state.path = [];
                    // Jika double mode dan R2/R2A, reset kembali ke Ico 1 setelah menang sequence
                    if (state.mode === 'double' && state.round !== "1") {
                        state.passedIco1 = false;
                        state.ico = 0; 
                    }
                } else if (state.pendingModalAction === 'failDouble') {
                    state.path = [];
                    state.passedIco1 = false;
                    state.ico = 0;
                    showToast("Misi berantai putus. Kembali ke Ico 1.", "error");
                } else if (state.pendingModalAction === 'failSingle') {
                    state.path = [];
                }
                
                updatePathUI();
                updateIcoUI();
                updateButtonState();
                
                state.pendingModalAction = 'none';
            }, 200);
        }

        // --- 5. LOGIKA EVALUASI UTAMA ---
        function evaluateAnswer() {
            // Cegah submit jika berada di Ico 2 tapi belum lulus Ico 1 (Mode Double, Ronde 2/2A)
            if (state.mode === 'double' && state.round !== "1" && state.ico === 1 && !state.passedIco1) {
                state.ico = 0;
                updateIcoUI();
                updateButtonState();
                showToast("Mode Double: Selesaikan Ico 1 terlebih dahulu!", "error");
                return;
            }

            if (state.path.length === 0) {
                showToast("Pilih minimal 1 huruf terlebih dahulu!", "error");
                return;
            }
            if (!targetInput.value) {
                showToast("Masukkan Target Number terlebih dahulu!", "error");
                return;
            }

            const target = parseInt(targetInput.value);
            if (!PRESETS[state.round]) {
                showToast(`Data untuk ronde ${state.round} belum tersedia!`, "error");
                return;
            }
            
            const currentValues = PRESETS[state.round][state.ico];
            const isR2 = (state.round === "2" || state.round === "2A");
            const isStep1 = isR2 && state.ico === 0;
            
            // Evaluasi 1: Matematika
            let sum = 0;
            let sumText = [];
            state.path.forEach(idx => {
                const val = currentValues[idx];
                sum += val;
                sumText.push(val);
            });
            const isMathCorrect = sum === target;
            
            // Evaluasi 2: Topologi (Adjacency) - Algoritma BFS
            let isPathCorrect = true;
            let pathErrorDetail = "Semua huruf saling menempel membentuk 1 kesatuan.";
            
            if (state.path.length > 1) {
                const visited = new Set();
                const queue = [state.path[0]];
                visited.add(state.path[0]);
                
                while (queue.length > 0) {
                    const currentIdx = queue.shift();
                    const neighbors = ADJACENCY[currentIdx];
                    
                    neighbors.forEach(neighborIdx => {
                        if (state.path.includes(neighborIdx) && !visited.has(neighborIdx)) {
                            visited.add(neighborIdx);
                            queue.push(neighborIdx);
                        }
                    });
                }
                
                if (visited.size === state.path.length) {
                    isPathCorrect = true;
                } else {
                    isPathCorrect = false;
                    pathErrorDetail = "Terdapat huruf yang terpisah (tidak menempel dengan kelompok lain).";
                }
            } else if (state.path.length === 1) {
                pathErrorDetail = "Hanya 1 sisi yang dipilih.";
            }

            // PERSIAPKAN TAMPILAN MODAL
            const modalResult = document.getElementById('modal-result');
            const modalContent = document.getElementById('modal-content');
            const resultTitle = document.getElementById('result-title');
            const btnCloseModal = document.getElementById('btn-close-modal');
            
            // Update UI Kriteria 1 (Math)
            const badgeMath = document.getElementById('badge-math');
            document.getElementById('result-math-detail').innerText = `${sumText.join(' + ')} = ${sum} (Target: ${target})`;
            if (isMathCorrect) {
                badgeMath.className = 'px-2 py-1 rounded text-xs font-bold bg-emerald-900/50 text-emerald-400 border border-emerald-500/30';
                badgeMath.innerText = 'BENAR';
            } else {
                badgeMath.className = 'px-2 py-1 rounded text-xs font-bold bg-red-900/50 text-red-400 border border-red-500/30';
                badgeMath.innerText = 'SALAH';
            }

            // Update UI Kriteria 2 (Path)
            const badgePath = document.getElementById('badge-path');
            document.getElementById('result-path-detail').innerText = pathErrorDetail;
            if (isPathCorrect) {
                badgePath.className = 'px-2 py-1 rounded text-xs font-bold bg-emerald-900/50 text-emerald-400 border border-emerald-500/30';
                badgePath.innerText = 'VALID';
            } else {
                badgePath.className = 'px-2 py-1 rounded text-xs font-bold bg-red-900/50 text-red-400 border border-red-500/30';
                badgePath.innerText = 'PUTUS';
            }

            // KESIMPULAN HASIL & TINDAKAN TERTUNDA
            if (isMathCorrect && isPathCorrect) {
                if (state.mode === 'double' && isStep1) {
                    // Berhasil Step 1 di Mode Double
                    resultTitle.innerText = "✨ ICO 1 VALID ✨";
                    resultTitle.className = "text-center font-bold text-2xl mb-5 text-blue-400";
                    btnCloseModal.innerText = "Lanjut Ico 2 ➔";
                    btnCloseModal.className = "mt-6 w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold transition-colors shadow";
                    state.pendingModalAction = 'goToIco2';
                } else {
                    // Berhasil Misi Keseluruhan (Mode Single ATAU Step 2 Mode Double)
                    resultTitle.innerText = "✨ MISI BERHASIL ✨";
                    resultTitle.className = "text-center font-bold text-2xl mb-5 text-emerald-400";
                    btnCloseModal.innerText = "Tutup & +1 Poin";
                    btnCloseModal.className = "mt-6 w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold transition-colors shadow";
                    state.pendingModalAction = 'win';
                }
            } else {
                // Gagal di Tahap Apapun
                resultTitle.innerText = "⚠️ MISI GAGAL ⚠️";
                resultTitle.className = "text-center font-bold text-2xl mb-5 text-red-400";
                
                if (state.mode === 'double' && state.round !== "1") {
                    btnCloseModal.innerText = "Tutup & Reset ke Awal";
                    btnCloseModal.className = "mt-6 w-full py-3 bg-red-700 hover:bg-red-600 text-white rounded-lg font-bold transition-colors shadow";
                    state.pendingModalAction = 'failDouble';
                } else {
                    btnCloseModal.innerText = "Tutup & Coba Lagi";
                    btnCloseModal.className = "mt-6 w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold transition-colors shadow";
                    state.pendingModalAction = 'failSingle';
                }
            }

            // Tampilkan Modal
            modalResult.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        // --- 6. EVENT LISTENERS SETUP ---
        document.getElementById('btn-add-player').onclick = () => {
            const newId = state.players.length > 0 ? Math.max(...state.players.map(p => p.id)) + 1 : 1;
            state.players.push({ id: newId, name: `Tim ${newId}`, active: state.players.length === 0, score: 0 });
            renderPlayers();
            renderLeaderboard();
        };

        // Mode Selection Events
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.className = "mode-btn flex-1 py-1.5 bg-transparent text-slate-400 hover:text-slate-200 rounded text-xs font-bold transition-colors";
                });
                e.target.className = "mode-btn flex-1 py-1.5 bg-indigo-600 text-white rounded text-xs font-bold transition-colors shadow";
                
                state.mode = e.target.dataset.mode;
                state.passedIco1 = false;
                state.path = [];
                state.ico = 0; // Kembalikan fokus ke Ico 1 saat ganti mode
                
                updatePathUI();
                updateIcoUI();
                updateButtonState();
                showToast(`Mode diubah ke: ${state.mode === 'double' ? 'Double (Berantai)' : 'Single (Bebas)'}`, 'success');
            };
        });

        // Round Selection Events
        document.querySelectorAll('.round-btn').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.round-btn').forEach(b => {
                    b.className = "round-btn flex-1 py-1.5 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded text-sm font-bold shadow transition-colors";
                });
                e.target.className = "round-btn flex-1 py-1.5 bg-indigo-600 text-white rounded text-sm font-bold shadow transition-colors";
                
                state.round = e.target.dataset.round;
                state.passedIco1 = false; // Reset progress multi-tahap
                state.ico = 0;            // Paksa kembali ke Ico 1
                
                updateIcoUI();
                updateButtonState();
            };
        });

        // Ico Selection Events
        document.querySelectorAll('.ico-btn').forEach(btn => {
            btn.onclick = (e) => {
                state.ico = parseInt(e.target.dataset.ico);
                updateIcoUI();
                updateButtonState();
            };
        });

        document.getElementById('btn-clear-path').onclick = () => {
            state.path = [];
            updatePathUI();
        };

        document.getElementById('btn-submit').onclick = evaluateAnswer;
        document.getElementById('btn-close-modal').onclick = hideResult;

        // IMPORT JSON
        document.getElementById('btn-import-topology').onclick = () => {
            document.getElementById('import-topology-file').click();
        };

        document.getElementById('import-topology-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    let isSuccess = false;
                    if (data.PRESETS) { PRESETS = data.PRESETS; isSuccess = true; }
                    if (data.ADJACENCY) { ADJACENCY = data.ADJACENCY; isSuccess = true; }
                    if (isSuccess) {
                        showToast('File JSON berhasil diimport!', 'success');
                        state.path = []; 
                        updatePathUI();
                    } else {
                        showToast('JSON tidak valid.', 'error');
                    }
                } catch (err) {
                    showToast('Gagal mengurai file JSON!', 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = ''; 
        });

        // --- 7. INITIAL RUN ---
        renderPlayers();
        renderLeaderboard();
        updatePathUI();
        updateIcoUI();
        updateButtonState();
    </script>
</body>
</html>
