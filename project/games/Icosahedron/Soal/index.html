                            for(let d=0; d<2; d++) {

    <script>

        const SPEED_SLIDER = document.getElementById('speed-slider');
        const SPEED_DISPLAY = document.getElementById('speed-display');
        const LEFT_PANEL = document.getElementById('left-panel');
        const BTN_TOGGLE_PANEL = document.getElementById('btn-toggle-panel');

        // Parameter Warna
        const COLOR_BG = 0x020617; // Slate 950
        const DEFAULT_FACE_COLOR = '#4338ca'; // Indigo 700
        const COLOR_TEXT = '#ffffff'; 

        // Koleksi Tema Warna
        const THEMES = {
            pastel: [
                { bg: '#FF9AA2', text: '#000000' }, { bg: '#FFB7B2', text: '#000000' },
                { bg: '#FFDAC1', text: '#000000' }, { bg: '#E2F0CB', text: '#000000' },

                { bg: '#FFB347', text: '#000000' }, { bg: '#B39EB5', text: '#000000' },
                { bg: '#DEA5A4', text: '#000000' }, { bg: '#CFCFC4', text: '#000000' },

            bold: [

                { bg: '#42D4F4', text: '#ffffff' }, { bg: '#F032E6', text: '#ffffff' }, 
                { bg: '#B6E812', text: '#ffffff' }, { bg: '#FABEBE', text: '#ffffff' }, 
                { bg: '#008080', text: '#ffffff' }, { bg: '#E6BEFF', text: '#ffffff' },

            ],
            vintage: [

                { bg: '#228B22', text: '#ffffff' }, // Hijau Hutan
                { bg: '#B8860B', text: '#ffffff' }, // Emas Gelap / Mustard
                { bg: '#000080', text: '#ffffff' }, // Biru Navy / Dongker
                { bg: '#D2691E', text: '#ffffff' }, // Cokelat Karamel
                { bg: '#4B0082', text: '#ffffff' }, // Ungu Plum / Indigo
                { bg: '#008080', text: '#ffffff' }, // Teal / Hijau Kebiruan Gelap
                { bg: '#8B008B', text: '#ffffff' }, // Magenta Tua
                { bg: '#556B2F', text: '#ffffff' }, // Hijau Zaitun Gelap
                { bg: '#A0522D', text: '#ffffff' }, // Cokelat Sienna
                { bg: '#4682B4', text: '#ffffff' }, // Biru Baja
                { bg: '#9932CC', text: '#ffffff' }, // Ungu Anggrek Gelap
                { bg: '#8B4513', text: '#ffffff' }, // Cokelat Pelana
                { bg: '#2F4F4F', text: '#ffffff' }, // Abu-abu Sabak Gelap
                { bg: '#CD5C5C', text: '#ffffff' }, // Merah Pudar / Indian Red
                { bg: '#008B8B', text: '#ffffff' }, // Cyan Gelap
                { bg: '#6B8E23', text: '#ffffff' }, // Hijau Lumut
                { bg: '#483D8B', text: '#ffffff' }, // Biru Sabak Tua
                { bg: '#B22222', text: '#ffffff' }, // Merah Bata
                { bg: '#191970', text: '#ffffff' }  // Biru Tengah Malam
            ]
        };

        let currentTheme = 'vintage'; 
        let memoryCorePalette = [...THEMES[currentTheme]];

        let globalIndexColor = '#000000'; // Warna indeks dikunci hitam
        let showIndex = true; // Status default huruf: MUNCUL
        let showValue = false; // Status default angka: TERSEMBUNYI
        let showMesh = true; // Status default dadu keseluruhan: MUNCUL

        // Variabel Global Three.js
        let scene, camera, renderer, controls;
        let icosahedrons = []; 
        let labelSprites = []; 
        let manualRotations = new Map(); 
        
        let allMaterials = [[], []];
        let allTextures = [[], []];
        let sharedGeometry, sharedEdgesGeometry, sharedEdgesMaterial;
        
        let diceCount = 1; 
        let activeEditDie = 0; 
        
        let speedMultiplier = 0.5;
        let baseRotationSpeed = { x: 0.005, y: 0.008, z: 0.003 };

        // Data Preset untuk Tiap Ronde Icosahedron sesuai parameter instruksi
        const R1_I1 = ["13", "34", "7", "41", "26", "11", "39", "17", "46", "23", "19", "31", "14", "43", "6", "29", "3", "47", "37", "21"];
        const R2_I1 = ["11", "26", "8", "41", "22", "17", "34", "19", "45", "25", "14", "33", "7", "48", "5", "29", "4", "38", "31", "21"];
        const R2_I2 = [
            "15", "30", "1000^{\\frac{1}{3}}", "2^5 \\; \\text{-} \\; 1", "216^{\\frac{2}{3}} + 1", 
            "\\frac{3^4 + 1}{2}", "3^3 \\; \\text{-} \\; 2^3", "28", "81^{\\frac{1}{4}}", "50", 
            "5^2 \\; \\text{-} \\; 2", "216^{\\frac{1}{3}}", "42", "12", "125^{\\frac{2}{3}}", 
            "\\sqrt{5^2 + 12^2}", "3^3 \\; \\text{-} \\; 1", "38", "64^{\\frac{2}{3}}", "7^2 \\; \\text{-} \\; 2"
        ];
        const EMPTY_20 = Array(20).fill("");

        // Matriks struktur memori permainan
        const roundPresets = {
            1: [R1_I1, EMPTY_20],
            2: [R2_I1, R2_I2]
        };

        // Fungsi LCG (Linear Congruential Generator) untuk Seed Random yang Konsisten
        function LCG(seed) {
            return function() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }
        }

        // Inisialisasi awal 
        let allFaceData = Array.from({length: 2}, (_, d) => 
            Array.from({length: 20}, (_, i) => ({ 
                label: String.fromCharCode(65 + i),
                value: roundPresets[1][d][i], 
                color: memoryCorePalette[i].bg, // Sementara
                textColor: '#ffffff' 
            }))
        );

        let faceAdjacency = Array.from({length: 20}, () => []);

        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : {r:0, g:0, b:0};
        }

        function colorDistance(hex1, hex2) {
            let c1 = hexToRgb(hex1);
            let c2 = hexToRgb(hex2);
            let rmean = (c1.r + c2.r) / 2;
            let r = c1.r - c2.r;
            let g = c1.g - c2.g;
            let b = c1.b - c2.b;
            return Math.sqrt( (2 + rmean/256) * (r*r) + 4*(g*g) + (2 + (255-rmean)/256) * (b*b) );
        }

        function generateSmartPalette(rng) {
            let bestPalette = [];
            let maxMinDistance = 0; 
            for (let attempt = 0; attempt < 5000; attempt++) {
                let shuffled = [...memoryCorePalette];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(rng() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                
                let localMinDistance = 9999;
                for (let i = 0; i < 20; i++) {
                    for (let neighbor of faceAdjacency[i]) {
                        if (neighbor > i) { 
                            let dist = colorDistance(shuffled[i].bg, shuffled[neighbor].bg);
                            if (dist < localMinDistance) {
                                localMinDistance = dist;
                            }
                        }
                    }
                }
                if (localMinDistance > maxMinDistance) {
                    maxMinDistance = localMinDistance;
                    bestPalette = [...shuffled];
                }
            }
            return bestPalette;
        }

        // --- INISIALISASI THREE.JS ---
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(COLOR_BG);
            
            const aspect = CANVAS_CONTAINER.clientWidth / CANVAS_CONTAINER.clientHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(CANVAS_CONTAINER.clientWidth, CANVAS_CONTAINER.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            CANVAS_CONTAINER.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(10, 10, 10);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x818cf8, 0.5);
            dirLight2.position.set(-10, -10, -10);
            scene.add(dirLight2);

            const radius = 5;
            const baseGeometry = new THREE.IcosahedronGeometry(radius, 0);
            
            sharedEdgesGeometry = new THREE.EdgesGeometry(baseGeometry);
            // Opacity dinaikkan ke 1.0 agar solid
            sharedEdgesMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1.0 });

            sharedGeometry = baseGeometry.clone().toNonIndexed();
            
            const uvAttribute = sharedGeometry.attributes.uv;
            for (let i = 0; i < 20; i++) {
                uvAttribute.setXY(i * 3 + 0, 0, 0);       
                uvAttribute.setXY(i * 3 + 1, 1, 0);       
                uvAttribute.setXY(i * 3 + 2, 0.5, 1);     
                sharedGeometry.addGroup(i * 3, 3, i);
            }
            uvAttribute.needsUpdate = true;

            const position = sharedGeometry.attributes.position;
            const isSameVertex = (i, j) => {
                return Math.abs(position.getX(i) - position.getX(j)) < 0.001 &&
                       Math.abs(position.getY(i) - position.getY(j)) < 0.001 &&
                       Math.abs(position.getZ(i) - position.getZ(j)) < 0.001;
            };
            for(let f1=0; f1<20; f1++) {
                for(let f2=f1+1; f2<20; f2++) {
                    let sharedVertices = 0;
                    for(let v1=0; v1<3; v1++) {
                        for(let v2=0; v2<3; v2++) {
                            if (isSameVertex(f1*3 + v1, f2*3 + v2)) sharedVertices++;
                        }
                    }
                    if (sharedVertices === 2) {
                        faceAdjacency[f1].push(f2);
                        faceAdjacency[f2].push(f1);
                    }
                }
            }

            // Determinisitc Smart Shuffle
            const rng1 = LCG(1024);
            const rng2 = LCG(2048);
            const palette1 = generateSmartPalette(rng1);
            const palette2 = generateSmartPalette(rng2);

            for (let i = 0; i < 20; i++) {
                allFaceData[0][i].color = palette1[i].bg;
                allFaceData[1][i].color = palette2[i].bg;
            }

            for (let d = 0; d < 2; d++) {
                for (let i = 0; i < 20; i++) {
                    const matData = createBlankMaterial();
                    allTextures[d].push({ canvas: matData.canvas, ctx: matData.ctx, texture: matData.texture });
                    allMaterials[d].push(matData.material);
                }
            }

            updateDiceDisplay();

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            controls.enableZoom = false;   
            controls.enableRotate = false; 
            controls.enablePan = false;    
            controls.autoRotate = false;

            setupRaycaster();

            window.addEventListener('resize', onWindowResize, false);
            for (let d = 0; d < 2; d++) {
                for (let i = 0; i < 20; i++) {
                    updateFace(d, i);
                }
            }
        }

        function setupRaycaster() {
            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();

            CANVAS_CONTAINER.addEventListener('pointerdown', (e) => {
                const rect = CANVAS_CONTAINER.getBoundingClientRect();
                pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(pointer, camera);
                const intersects = raycaster.intersectObjects(icosahedrons);

                if (intersects.length > 0) {
                    const mesh = intersects[0].object;
                    manualRotations.set(e.pointerId, {
                        mesh: mesh,
                        lastX: e.clientX,
                        lastY: e.clientY
                    });
                }
            });

            CANVAS_CONTAINER.addEventListener('pointermove', (e) => {
                if (manualRotations.has(e.pointerId)) {
                    const dragData = manualRotations.get(e.pointerId);
                    const deltaX = e.clientX - dragData.lastX;
                    const deltaY = e.clientY - dragData.lastY;

                    dragData.mesh.rotation.y += deltaX * 0.01;
                    dragData.mesh.rotation.x += deltaY * 0.01;

                    dragData.lastX = e.clientX;
                    dragData.lastY = e.clientY;
                }
            });

            const endPointer = (e) => {
                manualRotations.delete(e.pointerId);
            };
            CANVAS_CONTAINER.addEventListener('pointerup', endPointer);
            CANVAS_CONTAINER.addEventListener('pointercancel', endPointer);
        }

        function createTextSprite(message) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 256; 

            context.font = "bold 120px Arial, sans-serif";
            context.textAlign = "center";
            context.textBaseline = "middle";
            
            context.shadowColor = "rgba(0, 0, 0, 0.8)";
            context.shadowBlur = 6;
            context.shadowOffsetX = 2;
            context.shadowOffsetY = 2;

            context.fillStyle = "rgba(255, 255, 255, 1.0)";
            context.fillText(message, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            
            sprite.scale.set(5, 5, 1); 
            return sprite;
        }

        // FUNGSI KAMERA RESPONSIF: Mencegah Icosahedron kepotong di layar sempit/tablet
        function updateCameraZ() {
            const aspect = CANVAS_CONTAINER.clientWidth / CANVAS_CONTAINER.clientHeight;
            let responsiveScale = 1.0;
            
            // Jika layar cenderung tegak (potrait) atau tablet, kita mundur (zoom out) kameranya
            if (aspect < 1.5) {
                responsiveScale = 1.5 / aspect; 
                // Pembatasan agar tidak terlalu kecil di layar HP yang sangat panjang
                if (responsiveScale > 2.5) responsiveScale = 2.5; 
            }

            // Memundurkan jarak kamera sebesar 5% (mengurangi ukuran visual objek)
            const zoomOutFactor = 1.05; 
            if (diceCount === 1) {
                camera.position.set(0, 0, 13.0 * responsiveScale * zoomOutFactor);
            } else if (diceCount === 2) {
                camera.position.set(0, 0, 17.5 * responsiveScale * zoomOutFactor);
            }
        }

        function updateDiceDisplay() {
            icosahedrons.forEach(die => scene.remove(die));
            labelSprites.forEach(sprite => scene.remove(sprite)); 
            
            icosahedrons = [];
            labelSprites = [];
            const positions = [];
            
            updateCameraZ(); // Panggil fungsi adaptasi skala kamera

            if (diceCount === 1) {
                positions.push({ x: 0, y: 0, z: 0 });
            } else if (diceCount === 2) {
                positions.push({ x: -6.2, y: -1.8, z: 0 });
                positions.push({ x: 6.2, y: -1.8, z: 0 });
            }

            // Hanya bangun mesh 3D jika toggle "Tampilkan Icosahedron" sedang ON
            if (showMesh) {
                positions.forEach((pos, index) => {
                    const mesh = new THREE.Mesh(sharedGeometry, allMaterials[index]);
                    const edges = new THREE.LineSegments(sharedEdgesGeometry, sharedEdgesMaterial);
                    mesh.add(edges);
                    mesh.position.set(pos.x, pos.y, pos.z);
                    mesh.rotation.set(Math.random() * Math.PI*2, Math.random() * Math.PI*2, Math.random() * Math.PI*2);
                    scene.add(mesh);
                    icosahedrons.push(mesh);

                    if (diceCount > 1) {
                        const labelName = `${index + 1}`; 
                        const labelSprite = createTextSprite(labelName);
                        labelSprite.position.set(pos.x, pos.y + 7.5, pos.z); 
                        scene.add(labelSprite);
                        labelSprites.push(labelSprite);
                    }
                });
            }
            
            if (controls) controls.target.set(0, 0, 0); 
            camera.updateProjectionMatrix();
        }

        function createBlankMaterial() {
            const canvasSize = 512;
            const canvas = document.createElement('canvas');
            canvas.width = canvasSize;
            canvas.height = canvasSize;
            const ctx = canvas.getContext('2d');

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            const material = new THREE.MeshBasicMaterial({ map: texture });
            return { canvas, ctx, texture, material };
        }

        function updateFace(dieIndex, faceIndex) {
            const data = allFaceData[dieIndex][faceIndex];
            const canvasData = allTextures[dieIndex][faceIndex];
            if(!canvasData) return;
            
            const size = canvasData.canvas.width;
            const ctx = canvasData.ctx;
            const text = data.value;
            const labelText = data.label;
            const bgColor = data.color;
            const faceTextColor = data.textColor || COLOR_TEXT;
            const indexColor = globalIndexColor; 

            const renderFinal = (imgElement, isFallback) => {
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, size, size);

                // Mencerahkan warna dasar sedikit secara dinamis (12% putih)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.fillRect(0, 0, size, size);

                // Tambahkan aksen garis putih di pinggiran segitiga tanpa gap (bleeding edge)
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 8; // Ketebalan diturunkan dari 12 ke 8 agar aksen putih tidak terlalu mendominasi
                ctx.lineJoin = 'round'; // Sudut bulat untuk mencegah tepian terpotong tajam
                ctx.beginPath();
                // Kordinat menempel persis di titik terluar UV
                ctx.moveTo(0, size); 
                ctx.lineTo(size, size);
                ctx.lineTo(size / 2, 0);
                ctx.closePath();
                ctx.stroke();

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                if (showIndex && labelText) {
                    ctx.fillStyle = indexColor;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    let labelSize = size * 0.12; 
                    if(labelText.length > 2) labelSize = size * 0.08;
                    ctx.font = `bold ${labelSize}px Arial, sans-serif`;

                    const rotAngle = Math.atan2(3, -2);

                    ctx.fillText(labelText, size * 0.5, size * 0.20);

                    ctx.save();
                    ctx.translate(size * 0.15, size * 0.90);
                    ctx.rotate(-rotAngle); 
                    ctx.fillText(labelText, 0, 0);
                    ctx.restore();

                    ctx.save();
                    ctx.translate(size * 0.85, size * 0.90);
                    ctx.rotate(rotAngle); 
                    ctx.fillText(labelText, 0, 0);
                    ctx.restore();
                }

                if (showValue && text && text.trim() !== "") {
                    const mathY = size * 0.65; 
                    const textTrimmed = text.trim();
                    const isExact6or9 = textTrimmed === '6' || textTrimmed === '9';

                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetX = 1;
                    ctx.shadowOffsetY = 1;

                    if (isFallback || !imgElement) {
                        ctx.fillStyle = faceTextColor;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        
                        let fontSize = 120;
                        if (text.length > 2) fontSize = 80;
                        if (text.length > 4) fontSize = 55;
                        if (text.length > 6) fontSize = 35;

                        ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                        ctx.fillText(text, size / 2, mathY);

                        if (isExact6or9) {
                            const textWidth = ctx.measureText(text).width;
                            const lineY = mathY + fontSize * 0.35;
                            ctx.beginPath();
                            ctx.moveTo((size - textWidth) / 2, lineY);
                            ctx.lineTo((size + textWidth) / 2, lineY);
                            ctx.lineWidth = fontSize * 0.08;
                            ctx.strokeStyle = faceTextColor;
                            ctx.stroke();
                        }
                    } else {
                        const pxWidth = imgElement.customWidth;
                        const pxHeight = imgElement.customHeight;
                        ctx.drawImage(imgElement, (size - pxWidth) / 2, mathY - pxHeight / 2, pxWidth, pxHeight);

                        if (isExact6or9) {
                            const lineY = mathY + pxHeight / 2 + size * 0.02;
                            ctx.beginPath();
                            ctx.moveTo((size - pxWidth) / 2, lineY);
                            ctx.lineTo((size + pxWidth) / 2, lineY);
                            ctx.lineWidth = Math.max(pxHeight * 0.06, 3);
                            ctx.strokeStyle = faceTextColor;
                            ctx.stroke();
                        }
                    }
                }
                canvasData.texture.needsUpdate = true;
            };

            if (!text || text.trim() === "") {
                renderFinal(null, true);
                return;
            }

            if (window.mathJaxReady) {
                window.MathJax.tex2svgPromise(text, {display: true}).then((node) => {
                    const svg = node.querySelector('svg');
                    if (!svg) { renderFinal(null, true); return; }
                    
                    const viewBox = svg.getAttribute('viewBox').split(' ');
                    const vbWidth = parseFloat(viewBox[2]);
                    const vbHeight = parseFloat(viewBox[3]);
                    let pxWidth = vbWidth * 0.12;
                    let pxHeight = vbHeight * 0.12;

                    const scale = Math.min(1, (size * 0.60) / pxWidth, (size * 0.40) / pxHeight);
                    pxWidth *= scale;
                    pxHeight *= scale;

                    svg.setAttribute('width', pxWidth + 'px');
                    svg.setAttribute('height', pxHeight + 'px');
                    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

                    let svgString = new XMLSerializer().serializeToString(svg);
                    svgString = svgString.replace(/currentColor/g, COLOR_TEXT); 

                    const img = new Image();
                    img.customWidth = pxWidth;
                    img.customHeight = pxHeight;
                    img.onload = () => { renderFinal(img, false); };
                    img.onerror = () => { renderFinal(null, true); };
                    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
                }).catch(() => renderFinal(null, true));
            } else {
                renderFinal(null, true);
            }
        }

                const elem = document.documentElement;
                const isNativeFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

                    const requestFS = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.mozRequestFullScreen || elem.msRequestFullscreen;
                    if (requestFS) {
                        Promise.resolve(requestFS.call(elem)).catch(err => {
                            console.warn("Fullscreen diblokir oleh Iframe. Menggunakan Faux Fullscreen.");

                            document.body.classList.add('fixed', 'inset-0', 'z-[9999]', 'w-screen', 'h-screen');

                for (let i = 0; i < 20; i++) {
                    allFaceData[activeEditDie][i].value = mathExamples[i];
                    document.getElementById(`input-face-${i}`).value = allFaceData[activeEditDie][i].value;
                    updateFace(activeEditDie, i);
                }
            });

            // LOGIKA LOCAL STORAGE & EXPORT IMPORT
            const SAVE_KEY = 'mathIcosahedronSaves_v3';
            const statusText = document.getElementById('save-status');
            const inputSaveName = document.getElementById('input-save-name');
            const savedList = document.getElementById('saved-list');

            function showStatus(msg, colorClass) {
                statusText.innerText = msg;
                statusText.className = `text-[11px] text-center mt-2 ${colorClass} opacity-100 transition-opacity duration-300 font-medium`;
                setTimeout(() => { statusText.classList.remove('opacity-100'); statusText.classList.add('opacity-0'); }, 3000);
            }
            function getSaves() { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; }

            function renderSaveList() {
                const saves = getSaves();
                savedList.innerHTML = '';
                const names = Object.keys(saves);
                if (names.length === 0) {
                    savedList.innerHTML = '<li class="text-[11px] text-slate-500 text-center italic py-2">Belum ada data tersimpan</li>';
                    return;
                }
                names.forEach(name => {
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center bg-slate-800 p-1.5 rounded border border-slate-700 hover:border-slate-500 transition-colors group";
                    const nameBtn = document.createElement('button');
                    nameBtn.className = "flex-1 text-left text-xs text-slate-300 group-hover:text-white font-medium truncate mr-2 px-1";
                    nameBtn.innerText = name;
                    nameBtn.onclick = () => loadData(name);
                    const delBtn = document.createElement('button');
                    delBtn.className = "text-slate-500 hover:text-red-400 p-1 rounded transition-colors text-xs bg-slate-900/50 hover:bg-slate-900";
                    delBtn.innerHTML = "🗑️";
                    delBtn.onclick = () => {
                        const saves = getSaves(); delete saves[name];
                        localStorage.setItem(SAVE_KEY, JSON.stringify(saves));
                        renderSaveList(); showStatus(`🗑️ "${name}" dihapus.`, "text-red-400");
                    };
                    li.append(nameBtn, delBtn); savedList.appendChild(li);
                });
            }

            function saveCurrentData() {
                const name = inputSaveName.value.trim();
                if (!name) return showStatus("⚠️ Masukkan nama!", "text-amber-400");
                const saves = getSaves();
                saves[name] = { allFaces: allFaceData, indexColor: globalIndexColor, showIndex, showValue, showMesh, diceCount };
                localStorage.setItem(SAVE_KEY, JSON.stringify(saves));
                inputSaveName.value = ''; renderSaveList();
                showStatus(`✅ "${name}" disimpan!`, "text-emerald-400");
            }

            function loadData(name) {
                const saves = getSaves();
                if (saves[name]) {
                    const sd = saves[name];
                    globalIndexColor = sd.indexColor || '#000000';
                    document.getElementById('global-index-color').value = globalIndexColor;
                    
                    showIndex = sd.showIndex !== false; 
                    document.getElementById('toggle-index').checked = showIndex;
                    
                    showValue = sd.showValue === true; 
                    document.getElementById('toggle-value').checked = showValue;
                    
                    showMesh = sd.showMesh !== false; 
                    document.getElementById('toggle-mesh').checked = showMesh;

                    if (sd.diceCount) setDiceCount(sd.diceCount, false); 
                    
                    if (sd.allFaces) allFaceData = JSON.parse(JSON.stringify(sd.allFaces));
                    setActiveEditDie(0);
                    for (let d = 0; d < 2; d++) for (let i = 0; i < 20; i++) updateFace(d, i);
                    updateDiceDisplay();
                    showStatus(`📂 "${name}" dimuat.`, "text-indigo-400");
                }
            }

            document.getElementById('btn-save').addEventListener('click', saveCurrentData);
            
            document.getElementById('btn-export').addEventListener('click', () => {
                const data = localStorage.getItem(SAVE_KEY);
                if (!data || data === '{}') return showStatus("Kosong!", "text-amber-400");
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'math_icosahedron_presets.json'; a.click();
            });

            document.getElementById('btn-import').addEventListener('click', () => document.getElementById('file-import').click());
            document.getElementById('file-import').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        const current = getSaves();
                        localStorage.setItem(SAVE_KEY, JSON.stringify({...current, ...imported}));
                        renderSaveList(); showStatus("📥 Berhasil Import!", "text-emerald-400");
                    } catch(err) { showStatus("❌ File tidak valid", "text-red-400"); }
                };
                reader.readAsText(file);
                e.target.value = '';
            });

            document.getElementById('btn-copy-topo').addEventListener('click', () => {
                let text = "=== DATA TOPOLOGI & GEOMETRI ICOSAHEDRON ===\n\n";
                text += "1. STRUKTUR FISIK\n";
                text += "- Bentuk Geometri: Icosahedron 3D (terdiri dari 20 sisi segitiga sama sisi).\n";
                text += "- Letak Indeks Huruf (A-T): Tercetak di ketiga ujung/sudut pada masing-masing sisi segitiga.\n";
                text += "- Letak Nilai/Angka: Tercetak di titik tengah dari masing-masing sisi segitiga.\n\n";

                text += "2. RELASI SISI BERSEBELAHAN (ADJACENCY MAP)\n";
                text += "Penting untuk logika spasial: Berikut adalah daftar sisi mana saja yang saling menempel langsung (berbagi rusuk/garis tepi):\n";
                if(faceAdjacency.length > 0) {
                    for(let i=0; i<20; i++) {
                        let letter = String.fromCharCode(65 + i);
                        let neighbors = faceAdjacency[i].map(n => String.fromCharCode(65 + n)).join(", ");
                        text += `Sisi [${letter}] menempel dengan -> [${neighbors}]\n`;
                    }
                } else {
                    text += "(Data belum termuat penuh, coba beberapa detik lagi)\n";
                }
                text += "\n";

                text += "3. PEMETAAN ANGKA PER RONDE\n";
                for(let r=1; r<=2; r++) {
                    text += `--- RONDE ${r} ---\n`;
                    for(let d=0; d<2; d++) {
                        let isEmpty = roundPresets[r][d].every(v => v === "");
                        if(!isEmpty) {
                            text += `>> ICOSAHEDRON ${d+1}:\n`;
                            let pairs = [];
                            for(let i=0; i<20; i++) {
                                let letter = String.fromCharCode(65 + i);
                                let val = roundPresets[r][d][i];
                                if (val !== "") pairs.push(`[${letter}=${val}]`);
                            }
                            text += pairs.join(" | ") + "\n\n";
                        } else if (d===0 && isEmpty) {
                            text += ">> KOSONG (Belum ada angka yang diset)\n\n";
                            break; 
                        }
                    }
                }

                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed'; 
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showStatus("✅ Teks Topologi disalin!", "text-blue-400");
                } catch (err) {
                    showStatus("❌ Gagal menyalin teks.", "text-red-400");
                }
                document.body.removeChild(textarea);
            });

            document.getElementById('btn-export-topo').addEventListener('click', () => {
                if(faceAdjacency.length === 0) {
                    showStatus("⏳ Tunggu loading selesai", "text-amber-400");
                    return;
                }

                const topoJSON = {
                    metadata: {
                        deskripsi: "Topologi Geometri Memory Game (Math Icosahedron)",
                        bentuk_3d: "Icosahedron",
                        jumlah_sisi: 20,
                        panduan_ai: "Gunakan 'adjacency_map' untuk mengetahui sisi mana yang saling bersentuhan secara geometri (pathfinding/rotasi). Gunakan 'data_ronde' untuk mengetahui isi angka pada tiap huruf A-T."
                    },
                    adjacency_map: [],
                    data_ronde: []
                };

                for(let i = 0; i < 20; i++) {
                    let letter = String.fromCharCode(65 + i);
                    let neighbors = faceAdjacency[i].map(n => String.fromCharCode(65 + n));
                    topoJSON.adjacency_map.push({
                        sisi_huruf: letter,
                        bersebelahan_langsung_dengan: neighbors
                    });
                }

                for(let r = 1; r <= 2; r++) {
                    let roundObj = { nomor_ronde: r, icosahedrons: [] };
                    for(let d = 0; d < 2; d++) {
                        let isEmpty = roundPresets[r][d].every(v => v === "");
                        if(!isEmpty) {
                            let icoObj = { id_dadu: `Ico_${d+1}`, isi_sisi: [] };
                            for(let i = 0; i < 20; i++) {
                                let val = roundPresets[r][d][i];
                                if (val !== "") {
                                    icoObj.isi_sisi.push({ 
                                        huruf: String.fromCharCode(65 + i), 
                                        nilai: val 
                                    });
                                }
                            }
                            roundObj.icosahedrons.push(icoObj);
                        } else if (d === 0 && isEmpty) {
                            break; 
                        }
                    }
                    if (roundObj.icosahedrons.length > 0) {
                        topoJSON.data_ronde.push(roundObj);
                    }
                }

                const blob = new Blob([JSON.stringify(topoJSON, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; 
                a.download = 'topologi_icosahedron_ai.json'; 
                a.click();
                URL.revokeObjectURL(url);
                
                showStatus("✅ File JSON AI Diexport!", "text-purple-400");
            });

            renderSaveList();
        }

        // --- ANIMASI DAN RESIZE ---
        function onWindowResize() {
            camera.aspect = CANVAS_CONTAINER.clientWidth / CANVAS_CONTAINER.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(CANVAS_CONTAINER.clientWidth, CANVAS_CONTAINER.clientHeight);
            updateCameraZ(); // Adaptasikan skala saat layar diubah tanpa me-reset rotasi dadu
        }

        function animate() {
            requestAnimationFrame(animate);
            icosahedrons.forEach((die, idx) => {
                let isBeingDragged = false;
                manualRotations.forEach((data) => { if (data.mesh === die) isBeingDragged = true; });
                if (!isBeingDragged) {
                    die.rotation.x += baseRotationSpeed.x * speedMultiplier;
                    die.rotation.y += baseRotationSpeed.y * speedMultiplier;
                    die.rotation.z += baseRotationSpeed.z * speedMultiplier;
                }
            });
            controls.update();
            renderer.render(scene, camera);
        }

        // --- EKSEKUSI UTAMA ---
        init3D();
        initUI();
        animate();
    </script>
</body>
</html>
